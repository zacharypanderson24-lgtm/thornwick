
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thornwick Character Creator v14</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17191b;color:#e6d9c1;font:14px system-ui,sans-serif}
main{max-width:1220px;margin:auto;padding:24px}
h1{margin:0 0 6px;color:#e6c17c;font:700 30px Georgia,serif}
.sub{color:#b9b3a8;margin-bottom:18px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:22px}
.panel{background:#24272a;border:1px solid #45413a;border-radius:10px;padding:18px}
.preview{position:sticky;top:14px;align-self:start;text-align:center}
canvas{width:320px;height:320px;image-rendering:pixelated;background:#4c516e;border:2px solid #c39a55;outline:1px solid #30242a}
.summary{margin:12px 0 16px;color:#cfc4b3;min-height:40px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
button{background:#3a3f45;color:#eee;border:1px solid #645848;border-radius:8px;padding:8px 12px;cursor:pointer}
button.primary{background:#6b4a26;border-color:#c39a55}
.section{margin-bottom:16px}
.section h2{font-size:15px;color:#e6c17c;margin:0 0 10px}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label{display:block;font-size:12px;color:#cfc4b3;margin-bottom:4px}
select{width:100%;padding:8px;border-radius:8px;border:1px solid #4f4d48;background:#151719;color:#eee}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatch{min-width:56px;padding:6px 8px;border-radius:7px;border:1px solid #5b5348;background:#1a1d20;color:#e6d9c1;cursor:pointer;font-size:12px;text-align:center}
.swatch.active{outline:2px solid #c39a55;background:#2d2620}
.small{font-size:12px;color:#aca59a}
</style>
</head>
<body>
<main>
<h1>Thornwick Character Creator</h1>
<div class="sub">Version 19 · five age stages with independent hair color.</div>
<div class="grid">
  <section class="panel preview">
    <canvas id="portrait" width="48" height="48"></canvas>
    <div class="summary" id="summary"></div>
    <div class="actions">
      <button class="primary" id="randomAll">Random character</button>
      <button id="randomWardrobe">Random wardrobe</button>
      <button id="savePng">Save PNG</button>
      <button id="saveJson">Save JSON</button>
      <button id="loadJsonBtn">Load JSON</button>
      <button id="resetBtn">Reset</button>
      <input type="file" id="loadJsonFile" accept=".json,application/json" hidden>
    </div>
    <div class="small">Tip: choose <b>all_styles</b> to mix any outfit and any hat manually.</div>
  </section>
  <section class="panel">
    <div class="section"><h2>Identity</h2><div class="controls" id="identityControls"></div></div>
    <div class="section"><h2>Face & Hair</h2><div class="controls" id="faceControls"></div></div>
    <div class="section"><h2>Wardrobe</h2><div class="controls" id="wardrobeControls"></div></div>
    <div class="section"><h2>Clothing color</h2><div class="swatches" id="clothingSwatches"></div></div>
    <div class="section"><h2>Hat color</h2><div class="swatches" id="hatSwatches"></div></div>
  </section>
</div>
</main>

  createSwatches('clothingSwatches','clothing_color',availableColors('clothing', state.clothing));
  createSwatches('hatSwatches','headwear_color',state.headwear === 'none' ? ['original'] : availableColors('headwear', state.headwear));
  render();
}

function rgb(hex) {
  const s = hex.replace('#','');
  return [parseInt(s.slice(0,2),16), parseInt(s.slice(2,4),16), parseInt(s.slice(4,6),16)];
}
function mapColors(oldArr, newArr) {
  const out = {};
  oldArr.forEach((c,i) => out[rgb(c).join(',')] = rgb(newArr[i]));
  return out;
}
function rgbToHls(r,g,b) {
  r/=255; g/=255; b/=255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h=0, s=0, l=(max+min)/2;
  const d=max-min;
  if (d) {
    s = d/(1-Math.abs(2*l-1));
    if (max===r) h=((g-b)/d + (g<b?6:0));
    else if (max===g) h=((b-r)/d + 2);
    else h=((r-g)/d + 4);
    h /= 6;
  }
  return [h,l,s];
}
function hlsToRgb(h,l,s) {
  const c=(1-Math.abs(2*l-1))*s;
  const x=c*(1-Math.abs((h*6)%2-1));
  const m=l-c/2;
  let arr;
  if (h<1/6) arr=[c,x,0];
  else if (h<2/6) arr=[x,c,0];
  else if (h<3/6) arr=[0,c,x];
  else if (h<4/6) arr=[0,x,c];
  else if (h<5/6) arr=[x,0,c];
  else arr=[c,0,x];
  return arr.map(v => Math.round((v+m)*255));
}
function dyeMap(kind, name, variant) {
  if (variant === 'original' || name === 'none') return {};
  const entry = DATA.pal.masks[kind][name];
  if (!entry || !entry.colors || !entry.colors.length) return {};
  const target = DATA.pal.palettes[entry.material][variant];
  const [th, tl, ts] = rgbToHls(...rgb(target));
  const orig = entry.colors.map(c => rgbToHls(...rgb(c)));
  const ls = orig.map(v => v[1]);
  const center = (Math.min(...ls) + Math.max(...ls)) / 2;
  const mapped = ls.map(l => {
    const newL = Math.max(.12, Math.min(.91, tl + (l-center)*.94));
    return hlsToRgb(th, newL, ts);
  });
  const out = {};
  entry.colors.forEach((c, i) => out[rgb(c).join(',')] = mapped[i]);
  return out;
}
async function getImg(kind, name) {
  const key = kind + '/' + name;
  if (!images[key]) {
    images[key] = new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = reject;
      im.src = DATA.assets[kind][name];
    });
  }
  return images[key];
}
async function buildLayer(kind, name, colorMap = null) {
  const img = await getImg(kind, name);
  const c = document.createElement('canvas');
  c.width = 48; c.height = 48;
  const ctx = c.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(img, 0, 0);
  if (colorMap && Object.keys(colorMap).length) {
    const image = ctx.getImageData(0, 0, 48, 48);
    const p = image.data;
    for (let i=0; i<p.length; i+=4) {
      const k = [p[i], p[i+1], p[i+2]].join(',');
      const v = colorMap[k];
      if (v && p[i+3]) {
        p[i]=v[0]; p[i+1]=v[1]; p[i+2]=v[2];
      }
    }
    ctx.putImageData(image, 0, 0);
  }
  return c;
}
function applyHatOcclusion(canvas, hatName) {
  if (!DATA.hatMasks[hatName]) return canvas;
  const out = document.createElement('canvas');
  out.width = 48; out.height = 48;
  const ctx = out.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(canvas, 0, 0);
  const image = ctx.getImageData(0, 0, 48, 48);
  const p = image.data;
  const lines = DATA.hatMasks[hatName];
  for (let x=0; x<48; x++) {
    const yline = lines[x];
    if (yline === null || yline === undefined) continue;
    for (let y=0; y<=yline && y<48; y++) {
      p[(y*48 + x)*4 + 3] = 0;
    }
  }
  ctx.putImageData(image, 0, 0);
  return out;
}
async function render() {
  const rev = ++revision;
  normalizeState();
  const canvas = $('portrait');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,48,48);
  ctx.fillStyle = '#4c516e';
  ctx.fillRect(0,0,48,48);

  const faceMap = mapColors(DATA.skins.peach, DATA.skins[state.skin]);
  const hairMap = mapColors(DATA.hairs.brown, DATA.hairs[state.hair_color]);

  ctx.drawImage(await buildLayer('faces','standard',faceMap),0,0);
  ctx.drawImage(await buildLayer('age',state.age,faceMap),0,0);
  ctx.drawImage(await buildLayer('clothing',state.clothing,dyeMap('clothing',state.clothing,state.clothing_color)),0,0);

  let hairLayer = await buildLayer('hair',state.hair,hairMap);
  if (state.headwear !== 'none') hairLayer = applyHatOcclusion(hairLayer, state.headwear);
  ctx.drawImage(hairLayer,0,0);

  ctx.drawImage(await buildLayer('brows',state.brows,hairMap),0,0);
  ctx.drawImage(await buildLayer('beards',state.beard,hairMap),0,0);
  ctx.drawImage(await buildLayer('eyes',state.eyes),0,0);
  if (state.headwear !== 'none') {
    ctx.drawImage(await buildLayer('headwear',state.headwear,dyeMap('headwear',state.headwear,state.headwear_color)),0,0);
  }

  ctx.strokeStyle = '#30242a'; ctx.lineWidth = 1; ctx.strokeRect(.5,.5,47,47);
  ctx.strokeStyle = '#c39a55'; ctx.strokeRect(1.5,1.5,45,45);

  if (rev === revision) {
    $('summary').textContent = label(state.archetype) + ' · ' + label(state.clothing) + ' · ' + label(state.headwear);
  }
}
function randomizeAll() {
  state.archetype = pick([...keys(DATA.roles), 'regional']);
  state.climate = pick(keys(DATA.pools));
  state.skin = pick(keys(DATA.skins));
  state.age = pick(DATA.ages);
  state.hair_color = pick(keys(DATA.hairs));
  normalizeState();
  state.clothing = pick(availableClothing());
  state.headwear = pick(availableHats());
  normalizeState();
  state.hair = pick(availableHair());
  state.beard = pick(keys(DATA.assets.beards));
  state.brows = pick(keys(DATA.assets.brows));
  state.clothing_color = pick(availableColors('clothing', state.clothing));
  state.headwear_color = state.headwear === 'none' ? 'original' : pick(availableColors('headwear', state.headwear));
  refreshUI();
}
function randomizeWardrobe() {
  state.clothing = pick(availableClothing());
  state.headwear = pick(availableHats());
  normalizeState();
  state.clothing_color = pick(availableColors('clothing', state.clothing));
  state.headwear_color = state.headwear === 'none' ? 'original' : pick(availableColors('headwear', state.headwear));
  refreshUI();
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('randomAll').onclick = randomizeAll;
$('randomWardrobe').onclick = randomizeWardrobe;
$('resetBtn').onclick = () => { Object.assign(state, defaults); refreshUI(); };
$('savePng').onclick = async () => { await render(); $('portrait').toBlob(b => download(b, 'thornwick_portrait.png')); };
$('saveJson').onclick = () => download(new Blob([JSON.stringify(state, null, 2)], {type:'application/json'}), 'thornwick_appearance.json');
$('loadJsonBtn').onclick = () => $('loadJsonFile').click();
$('loadJsonFile').onchange = async () => {
  if (!$('loadJsonFile').files.length) return;
  try {
    Object.assign(state, JSON.parse(await $('loadJsonFile').files[0].text()));
    refreshUI();
  } catch (err) {
    alert('Could not load appearance JSON.');
  }
};
refreshUI();
</script>
</body>
