<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thornwick Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: HUD bar on top, map fills the middle with floating panels, build bar at the bottom. Single dark pixel theme by choice. */
:root {
  color-scheme: dark;
  --bg: #0e1118; --panel: #1b2030; --panel2: #262d42; --line: #3a4361;
  --ink: #e8e4d6; --dim: #9aa0b4; --accent: #e0a93a; --good: #7cd17f; --bad: #e0675a;
  --display: 'Press Start 2P', ui-monospace, 'Courier New', monospace; --body: 'VT323', ui-monospace, 'Courier New', monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 20px; overflow: hidden; }
#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
#hud { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 8px 16px; background: var(--panel); border-bottom: 3px solid var(--line); }
.brand { font-family: var(--display); font-size: 12px; color: var(--accent); letter-spacing: .5px; }
.stat { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.stat .sw { width: 10px; height: 10px; align-self: center; border: 2px solid #0008; }
.stat .lbl { font-family: var(--display); font-size: 8px; color: var(--dim); }
.stat .val { font-size: 24px; line-height: 1; min-width: 2ch; }
.rate { font-size: 17px; color: var(--dim); min-width: 3ch; }
.rate.up { color: var(--good); } .rate.down { color: var(--bad); }
.grp { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.spacer { flex: 1; }
.bar { display: grid; justify-items: center; gap: 2px; }
.bar .track { position: relative; width: 14px; height: 44px; background: #0e1118; border: 2px solid var(--line); }
.bar .mid { position: absolute; left: 0; right: 0; top: 20px; height: 2px; background: var(--dim); opacity: .6; }
.bar .fill { position: absolute; left: 0; right: 0; }
.bar .fill.pos { background: var(--good); } .bar .fill.neg { background: var(--bad); }
.bar span { font-size: 15px; color: var(--dim); line-height: 1; }
.hint { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: #1b2030ee; border: 2px solid var(--accent); padding: 5px 12px; font-size: 20px; pointer-events: none; max-width: 56%; text-align: center; }
.rectinfo { position: absolute; background: #1b2030; border: 2px solid var(--accent); padding: 2px 8px; font-size: 18px; pointer-events: none; z-index: 3; }
[hidden] { display: none !important; }
#lens { left: 12px; bottom: 12px; width: auto; }
#banner { right: 12px; top: 12px; width: auto; z-index: 15; }
.swatch { width: 28px; height: 28px; border: 2px solid var(--line); cursor: pointer; padding: 0; } .swatch:hover, .swatch.on { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--body); font-size: 19px; color: var(--ink); background: var(--panel2); border: 2px solid var(--line); padding: 3px 8px; cursor: pointer; }
.chip i { width: 11px; height: 11px; display: inline-block; border: 2px solid #0008; } .chip.off { opacity: .4; }
.chip:hover { border-color: var(--accent); }
#hud-warn { color: var(--bad); font-size: 20px; }
.btn { font-family: var(--display); font-size: 9px; color: var(--ink); background: var(--panel2); border: 2px solid var(--line); padding: 8px 10px; cursor: pointer; }
.btn:hover { border-color: var(--accent); } .btn.on { background: var(--accent); color: #1b1608; border-color: var(--accent); } .btn.off { color: var(--dim); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#stage { position: relative; overflow: hidden; min-height: 0; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; cursor: crosshair; }
.panel { position: absolute; background: #1b2030ee; border: 3px solid var(--line); padding: 10px 12px; max-width: 300px; }
.panel h2 { margin: 0 0 6px; font-family: var(--display); font-size: 10px; color: var(--accent); font-weight: normal; line-height: 1.5; }
.panel p { margin: 0 0 4px; font-size: 19px; line-height: 1.1; } .panel p.dim { color: var(--dim); }
#info { left: 12px; top: 12px; width: 290px; }
#goals { right: 12px; top: 12px; width: 270px; }
#goals ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
#goals li { font-size: 19px; line-height: 1.1; padding-left: 20px; position: relative; color: var(--ink); }
#goals li::before { content: ''; position: absolute; left: 0; top: 3px; width: 11px; height: 11px; border: 2px solid var(--dim); }
#goals li.done { color: var(--dim); text-decoration: line-through; } #goals li.done::before { background: var(--good); border-color: var(--good); }
#zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 6px; }
#toast { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; pointer-events: none; }
.toast { background: #3a1d1d; border: 2px solid var(--bad); padding: 6px 12px; font-size: 20px; }
#toolbar { display: flex; gap: 6px; padding: 8px 12px 10px; background: var(--panel); border-top: 3px solid var(--line); overflow-x: auto; }
.tool { position: relative; flex: 0 0 auto; width: 92px; display: grid; justify-items: center; gap: 1px; padding: 4px 4px 6px; background: var(--panel2); border: 2px solid var(--line); color: var(--ink); cursor: pointer; font-family: var(--body); }
.tool:hover { border-color: var(--dim); } .tool.on { border-color: var(--accent); background: #3a3320; }
.tool .ico { width: 64px; height: 80px; margin-bottom: -22px; margin-top: -6px; image-rendering: pixelated; pointer-events: none; }
.tool .tl { font-family: var(--display); font-size: 7px; line-height: 1.4; margin-top: 18px; }
.tool .tc { font-size: 17px; line-height: 1; min-height: 17px; display: flex; gap: 5px; } .tc i { font-style: normal; } .cw { color: #d9a56a; } .cs { color: #b9bfd0; } .cg { color: #f2c94c; }
.tool .tk { position: absolute; top: 3px; left: 5px; font-size: 15px; color: var(--dim); }
@media (max-width: 700px) { #goals { display: none; } #info { width: 230px; } .brand { width: 100%; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }

.lab { position: absolute; inset: 0; background: #131826; z-index: 20; display: flex; flex-direction: column; padding: 14px 18px; overflow: hidden; }
.lab-head { display: flex; justify-content: space-between; align-items: center; } .lab-head h2 { margin: 0; font-family: var(--display); font-size: 12px; color: var(--accent); font-weight: normal; }
.lab-help { margin: 6px 0 10px; color: var(--dim); font-size: 19px; line-height: 1.1; max-width: 900px; }
.lab-body { display: grid; grid-template-columns: 220px 1fr; gap: 16px; min-height: 0; flex: 1; }
.lab-list { overflow-y: auto; display: flex; flex-direction: column; gap: 3px; padding-right: 6px; }
.lab-list h3 { margin: 10px 0 2px; font-family: var(--display); font-size: 8px; color: var(--dim); font-weight: normal; }
.lab-item { display: flex; justify-content: space-between; text-align: left; font-family: var(--body); font-size: 19px; color: var(--ink); background: var(--panel2); border: 2px solid var(--line); padding: 3px 8px; cursor: pointer; }
.lab-item.on { border-color: var(--accent); } .lab-item i { font-style: normal; color: var(--dim); }
.lab-main { overflow-y: auto; padding-right: 8px; } .lab-title { margin: 0 0 4px; font-family: var(--display); font-size: 11px; font-weight: normal; }
.lab-meta, .lab-desc { margin: 0 0 8px; font-size: 19px; line-height: 1.1; max-width: 820px; } .lab-meta { color: var(--dim); }
.lab-row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 6px 0; } .lab-row.small { margin: 4px 0; }
.chk { font-size: 19px; display: flex; align-items: center; gap: 6px; } .btn.sm { padding: 4px 6px; font-size: 8px; }
.lab-cells { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }
.lab-cell { border: 2px dashed var(--line); padding: 8px; background: #0e1118; } .lab-cell.drop { border-color: var(--accent); }
.lab-cl { font-family: var(--display); font-size: 8px; color: var(--dim); margin-bottom: 6px; } .lab-st { font-size: 17px; color: var(--dim); margin: 4px 0; }
.lab-prev { image-rendering: pixelated; display: block; background: #2c4a2a; }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="brand">THORNWICK</div>
    <div class="grp">
      <div class="stat"><span class="sw" style="background:#d9b94a"></span><span class="lbl">FOOD</span><span class="val" id="v-food">0</span><span class="rate" id="r-food"></span></div>
      <div class="stat"><span class="sw" style="background:#8a5a34"></span><span class="lbl">WOOD</span><span class="val" id="v-wood">0</span><span class="rate" id="r-wood"></span></div>
      <div class="stat"><span class="sw" style="background:#9fa2ad"></span><span class="lbl">STONE</span><span class="val" id="v-stone">0</span><span class="rate" id="r-stone"></span></div>
      <div class="stat"><span class="sw" style="background:#e0873a"></span><span class="lbl">ORE</span><span class="val" id="v-ore">0</span><span class="rate" id="r-ore"></span></div>
      <div class="stat"><span class="sw" style="background:#f2c94c"></span><span class="lbl">GOLD</span><span class="val" id="v-gold">0</span><span class="rate" id="r-gold"></span></div>
    </div>
    <div class="grp">
      <div class="stat"><span class="lbl">VILLAGERS</span><span class="val" id="v-peas">0</span></div>
      <div class="stat"><span class="lbl">JOBS FILLED</span><span class="val" id="v-jobs">0</span></div>
      <div class="stat"><span class="lbl">SOLDIERS</span><span class="val" id="v-sold">0</span></div>
      <div class="stat"><span class="lbl">DAY</span><span class="val" id="v-day">1</span></div>
    </div>
    <div class="grp" id="dem" aria-label="Demand"></div>
    <span id="hud-warn"></span>
    <div class="spacer"></div>
    <div class="grp">
      <button class="btn" id="lensbtn" type="button">Resources (V)</button>
      <button class="btn" id="bannerbtn" type="button">Banner</button>
      <button class="btn" id="texbtn" type="button">Textures</button>
      <button class="btn" id="savebtn" type="button">Save</button>
      <button class="btn" id="newbtn" type="button">New</button>
      <button class="btn" id="draft" type="button">Drafting on</button>
      <button class="btn" id="sp0" type="button">Pause</button>
      <button class="btn" id="sp1" type="button">1x</button>
      <button class="btn" id="sp3" type="button">3x</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="c"></canvas>
    <aside class="panel" id="info"></aside>
    <aside class="panel" id="goals"><h2>First goals</h2><ul id="goals-list"></ul></aside>
    <div class="panel" id="lens" hidden><h2>Resource view</h2><div class="chips">
      <button class="chip" id="lc-wood" type="button"><i style="background:#3fd264"></i>Forest</button>
      <button class="chip" id="lc-stone" type="button"><i style="background:#dfe3f2"></i>Stone</button>
      <button class="chip" id="lc-ore" type="button"><i style="background:#ff8c28"></i>Iron ore</button>
      <button class="chip" id="lc-fert" type="button"><i style="background:#cdeb3c"></i>Fertile soil</button></div></div>
    <div id="zoom"><button class="btn" id="rotl" type="button" title="Rotate view (Q)">&#8634;</button><button class="btn" id="rotr" type="button" title="Rotate view (E)">&#8635;</button><button class="btn" id="zout" type="button">-</button><button class="btn" id="zin" type="button">+</button></div>
    <div id="hint" class="hint" hidden></div>
    <div id="lab" class="lab" hidden></div>
    <div class="panel" id="banner" hidden><h2>Your banner</h2><div class="chips" id="banner-sw"></div><label class="chk" style="margin-top:8px">Custom <input type="color" id="bannerpick" value="#b3202a"></label><div class="chips" style="margin-top:6px"><button class="chip" id="banner-reset" type="button">Original</button></div></div>
    <div id="rectinfo" class="rectinfo" hidden></div>
    <div id="toast"></div>
  </main>
  <nav id="toolbar" aria-label="Build tools"></nav>
</div>
<script>
// ---------- Simulation (no DOM) ----------
const N = 40;
const COST = {
  road: { wood: 1 }, house: { wood: 10 }, farm: { wood: 8 }, wood: { wood: 6 }, quarry: { wood: 10 }, mine: { wood: 12 },
  market: { wood: 12 }, well: { wood: 5, stone: 5 }, barracks: { wood: 20, stone: 15, gold: 20 }
};
const NAMES = {
  road: 'Dirt Road', house: 'Timber House', farm: 'Farm', wood: 'Woodcutter', quarry: 'Quarry', mine: 'Iron Mine', market: 'Market',
  well: 'Well', barracks: 'Barracks', hall: 'Town Hall',
  zoneRes: 'Housing Zone', zoneFarm: 'Farm Zone', zoneComm: 'Commerce Zone', zoneWood: 'Lumber Zone', zoneMine: 'Mining Zone'
};
const ZONE_NAMES = { res: 'Housing zone', farm: 'Farm zone', comm: 'Commerce zone', wood: 'Lumber zone', mine: 'Mining zone' };
const ZONE_KINDS = ['res', 'farm', 'comm', 'wood', 'mine'];
const JOBS = { farm: 4, wood: 3, quarry: 3, mine: 3, market: 2 };
const HOUSE_CAP = [0, 4, 6];
const BUNKS = 6, HALL_CAP = 6, WELL_R = 4, WORK_R = 3, MARKET_R = 5, STORAGE = 400;
const NB = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const COST2 = { house: { wood: 30 }, farm: { wood: 24 }, market: { wood: 32 } };
const costOf = (type, sz) => (sz === 2 && COST2[type]) ? COST2[type] : (COST[type] || {});
const capOf = b => b.sz === 2 ? [0, 14, 20][b.lvl] : HOUSE_CAP[b.lvl];
const jobsOf = b => Math.round((JOBS[b.t] || 0) * (b.sz === 2 ? 2.5 : 1));
const foodOf = b => 3 * (b.sz === 2 ? 2.6 : 1);
const marketR = b => b.sz === 2 ? 7 : 5;
const nameOf = b => b.sz === 2 ? ({ house: 'Large House', farm: 'Large Farm', market: 'Bazaar' }[b.t] || NAMES[b.t]) : NAMES[b.t];
const tilesOf = b => { const a = []; for (let j = 0; j < (b.sz || 1); j++) for (let i = 0; i < (b.sz || 1); i++) a.push([b.x + i, b.y + j]); return a; };

function hash2(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul((s || 0) | 0, 2147483647)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const sm = t => t * t * (3 - 2 * t);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  const u = sm(xf), v = sm(yf);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const inb = (x, y) => x >= 0 && y >= 0 && x < N && y < N;
const ctr = o => (o.sz || 1) > 1 ? ((o.sz || 1) - 1) / 2 : 0;
const cheb = (a, b) => Math.max(Math.abs(a.x + ctr(a) - b.x - ctr(b)), Math.abs(a.y + ctr(a) - b.y - ctr(b)));
const clamp1 = v => Math.max(-1, Math.min(1, v));

function createWorld(seed) {
  seed = seed || 7;
  const S = {
    seed, grid: [], deco: [], zone: [], fert: [], blds: [], hall: null,
    res: { food: 60, wood: 120, stone: 30, ore: 10, gold: 80 }, rate: { food: 0, wood: 0, stone: 0, ore: 0, gold: 0 },
    dem: { res: 0, farm: 0, comm: 0, wood: 0, mine: 0 }, note: { res: '', farm: '', comm: '', wood: '', mine: '' }, flags: {},
    peasants: 6, popAcc: 0, soldiers: 0, day: 1, drafting: true, starving: false, trained: 0, d: null
  };
  for (let y = 0; y < N; y++) { S.grid.push(Array(N).fill(null)); S.deco.push(Array(N).fill(null)); S.zone.push(Array(N).fill(null)); S.fert.push(Array(N).fill(false)); }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const dist = Math.max(Math.abs(x - 20), Math.abs(y - 20));
    S.fert[y][x] = Math.max(Math.abs(x - 20), Math.abs(y - 23)) <= 7 || vnoise(x * 0.11 + 10, y * 0.11 + 10, seed + 20) > 0.55;
    if (dist < 6) continue;
    const f = vnoise(x * 0.16, y * 0.16, seed) * 0.65 + vnoise(x * 0.4, y * 0.4, seed + 3) * 0.35;
    const r = vnoise(x * 0.22 + 40, y * 0.22 + 40, seed + 9);
    const o = vnoise(x * 0.3 + 90, y * 0.3 + 90, seed + 13);
    if (o > 0.72 && hash2(x, y, seed + 7) > 0.35) S.deco[y][x] = 'ore';
    else if (f > 0.56 && hash2(x, y, seed + 5) > 0.22) S.deco[y][x] = 'tree';
    else if (r > 0.7 && hash2(x, y, seed + 6) > 0.35) S.deco[y][x] = 'rock';
  }
  // The 3x3 Town Hall is anchored at (19,19), centered on the original (20,20).
  // All nine cells are reserved before roads and zones are placed.
  addBld(S, 'hall', 19, 19, 3);
  for (let y = 22; y <= 26; y++) addBld(S, 'road', 20, y);
  addBld(S, 'house', 19, 23).zoned = true; addBld(S, 'house', 21, 23).zoned = true; addBld(S, 'farm', 19, 25).zoned = true;
  S.zone[23][19] = 'res'; S.zone[23][21] = 'res'; S.zone[25][19] = 'farm';
  recalc(S); computeDemand(S);
  return S;
}
function saveWorld(S) { return JSON.stringify(Object.assign({}, S, { grid: undefined, hall: undefined, d: undefined, v: 1 })); }
function loadWorld(str) {
  const o = JSON.parse(str); if (!o || !o.blds || !o.deco) return null;
  const S = Object.assign({}, o); S.grid = []; S.hall = null; S.d = null;
  for (let y = 0; y < N; y++) S.grid.push(Array(N).fill(null));
  // Upgrade legacy one-tile barracks only when their 2x2 footprint is clear.
  // Crowded old saves keep the original 1x1 building instead of overwriting neighbours.
  for (const b of S.blds) if (b.t === 'barracks' && (b.sz || 1) === 1) {
    const cells = [[b.x, b.y], [b.x + 1, b.y], [b.x, b.y + 1], [b.x + 1, b.y + 1]];
    const clear = cells.every(([x, y]) => inb(x, y) &&
      !S.blds.some(other => other !== b && tilesOf(other).some(([i, j]) => i === x && j === y)) &&
      S.deco[y][x] !== 'rock' && S.deco[y][x] !== 'ore');
    if (clear) { b.sz = 2; for (const [x, y] of cells) S.deco[y][x] = null; }
  }
  for (const b of S.blds) { for (const [i, j] of tilesOf(b)) S.grid[j][i] = b; if (b.t === 'hall') S.hall = b; }
  if (!S.hall) return null;
  recalc(S); computeDemand(S); return S;
}
function addBld(S, t, x, y, sz) {
  const b = { t, x, y, sz: sz || (t === 'hall' ? 3 : t === 'barracks' ? 2 : 1), prog: 0, served: false, lvl: 1 };
  S.blds.push(b);
  for (const [i, j] of tilesOf(b)) { S.grid[j][i] = b; S.deco[j][i] = null; if (t === 'road') S.zone[j][i] = null; }
  if (t === 'hall') S.hall = b;
  return b;
}
function roadPathCheck(S, path) {
  let n = 0;
  for (const [x, y] of path) {
    if (!inb(x, y)) return { ok: false, n, reason: 'Outside the map' };
    const g = S.grid[y][x];
    if (g && g.t === 'road') continue;
    if (g) return { ok: false, n, reason: 'A building is in the way' };
    const dc = S.deco[y][x];
    if (dc === 'rock' || dc === 'ore') return { ok: false, n, reason: 'Rock or ore is in the way. Route around it or mine it first' };
    n++;
  }
  if (S.res.wood < n * COST.road.wood) return { ok: false, n, reason: 'Not enough wood: ' + n + ' new road tiles need ' + n + ' wood' };
  return { ok: true, n };
}
function placeRoadPath(S, path) {
  const c = roadPathCheck(S, path);
  if (!c.ok || !c.n) return c;
  S.res.wood -= c.n * COST.road.wood;
  for (const [x, y] of path) { const g = S.grid[y][x]; if (!g) addBld(S, 'road', x, y); }
  recalc(S);
  return c;
}
function canAfford(S, type) {
  const c = COST[type] || {};
  for (const k in c) if (S.res[k] < c[k]) return { ok: false, reason: 'Not enough ' + k + ' (need ' + c[k] + ')' };
  return { ok: true };
}
function canPlace(S, type, x, y) {
  const footprint = { x, y, sz: type === 'hall' ? 3 : type === 'barracks' ? 2 : 1, t: type };
  for (const [tx, ty] of tilesOf(footprint)) {
    if (!inb(tx, ty)) return { ok: false, reason: 'Outside the map' };
    if (S.grid[ty][tx]) return { ok: false, reason: 'That tile is already built on' };
    if (S.deco[ty][tx] === 'rock' || S.deco[ty][tx] === 'ore')
      return { ok: false, reason: 'Rock and ore block this tile. Zone it for mining to clear it' };
  }
  if (type === 'barracks' && !nextToRoad(S, footprint)) return { ok: false, reason: 'Barracks must touch a road' };
  return canAfford(S, type);
}

  ['Zone forest and get a woodcutter', S => S.blds.some(b => b.t === 'wood' && b.zoned)],
  ['Zone commerce and get a market', S => S.blds.some(b => b.t === 'market')],
  ['Zone ore and get an iron mine', S => S.blds.some(b => b.t === 'mine')],
  ['Raise a barracks and train 6 soldiers', S => S.trained >= 6]
];
const goalsEl = $('goals-list');
GOALS.forEach((g, i) => { const li = document.createElement('li'); li.id = 'g' + i; li.textContent = g[0]; goalsEl.appendChild(li); });
function updateGoals() { GOALS.forEach((g, i) => { if (g[1](S)) S['goal' + i] = true; $('g' + i).classList.toggle('done', !!S['goal' + i]); }); }
function describe(t) {
  const b = S.grid[t.y][t.x], d = S.d;
  if (!b) {
    const k = S.deco[t.y][t.x];
    if (k === 'tree') return ['Forest', ['A woodcutter within 3 tiles harvests these trees.', 'Building here clears the tree.']];
    if (k === 'rock') return ['Rock outcrop', ['Stone. A mining zone here grows quarries.', 'Rocks block other buildings.']];
    if (k === 'ore') return ['Iron ore', ['A mining zone here grows iron mines. Soldiers need ore to arm.', 'Ore blocks other buildings.']];
    const z = S.zone[t.y][t.x];
    if (z) {
      const nm = ZONE_NAMES[z];
      return [nm, [zoneServed(S, t.x, t.y) ? (S.note[z] || 'Ready to grow.') : 'No road access. Zones need a road touching them that leads to the Town Hall.', 'Use Clear to remove the zone.']];
    }
    return [S.fert[t.y][t.x] ? 'Fertile soil' : 'Open grass', [S.fert[t.y][t.x] ? 'Good farmland. Paint a farm zone here.' : 'Poor soil. Farms need fertile land.', 'Free to zone or build on.']];
  }
  const L = []; const nm = nameOf(b);
  if (b.zoned) L.push('Grew from a zone.');
  if (b.t !== 'road' && b.t !== 'hall') L.push(b.served ? 'Road connected' : 'No road link. Place a road touching this building that leads back to the Town Hall.');
  if (b.t === 'road') L.push(b.served ? 'Connected to the Town Hall' : 'Not connected to the Town Hall');
  if (b.t === 'hall') L.push('Houses 6 people. Storage limit ' + STORAGE + ' per resource.');
  if (b.t === 'house') L.push('Level ' + b.lvl + ' · holds ' + capOf(b) + ' people', b.lvl === 1 ? 'A well within 4 tiles upgrades it to level 2.' : 'Upgraded by a nearby well.');
  if (b.t === 'farm') L.push('Jobs: ' + jobsOf(b) + ' · makes ' + (b.served ? (foodOf(b) * d.ratio).toFixed(1) : '0') + ' food per second', 'Staffed at ' + Math.round(d.ratio * 100) + '%');
  if (b.t === 'wood') { const n = countDeco(S, b.x, b.y, 3, 'tree'); L.push('Jobs: 3 · ' + n + ' trees in range', n ? 'Makes ' + (b.served ? (2.5 * d.ratio).toFixed(1) : '0') + ' wood per second' : 'No trees left. Move it closer to a forest.'); }
  if (b.t === 'quarry') { const n = countDeco(S, b.x, b.y, 3, 'rock'); L.push('Jobs: 3 · ' + n + ' rock tiles in range', n ? 'Makes ' + (b.served ? (2 * d.ratio).toFixed(1) : '0') + ' stone per second' : 'Out of rock. Clear it and zone a new site.'); }
  if (b.t === 'mine') { const n = countDeco(S, b.x, b.y, 3, 'ore'); L.push('Jobs: 3 · ' + n + ' ore tiles in range', n ? 'Makes ' + (b.served ? (1.5 * d.ratio).toFixed(1) : '0') + ' ore per second' : 'Out of ore. Clear it and zone a new site.'); }
  if (b.t === 'market') L.push('Jobs: ' + jobsOf(b) + ' · covers homes within ' + (b.sz === 2 ? 7 : 5) + ' tiles', 'Earns gold from covered villagers (' + Math.round(d.cov * 100) + '% of homes covered).');
  if (b.t === 'barracks') L.push('Sleeps 6 soldiers · army ' + S.soldiers + '/' + d.bunks, 'Each recruit costs 2 wood, 1 gold, 1 ore and one villager.', 'Soldiers eat 1.5x and cost 0.1 gold per second.');
  if (b.t === 'well') L.push('Upgrades houses within 4 tiles.');
  return [nm, L];
}
function updateInfo() {
  const t = pinned || hover; const el = $('info');
  if (!t) {
    el.innerHTML = '<h2>Thornwick</h2><p>Paint zones beside a road that reaches the Town Hall. Buildings grow there by themselves when the demand bars show a need and there is wood. Press V to see forest, stone, ore and farmable soil. Soldiers sleep in barracks, so every recruit needs a bunk.</p><p class="dim">Drag to pan. Scroll to zoom. Pick a tool below. Drag to paint roads, drag a box to zone.</p>';
    return;
  }
  const [name, lines] = describe(t);
  el.innerHTML = '<h2>' + name + '</h2>' + lines.map(l => '<p>' + l + '</p>').join('') + '<p class="dim">Tile ' + t.x + ', ' + t.y + '</p>';
}
function setSpeed(s) { speed = s; for (const id of [0, 1, 3]) $('sp' + id).classList.toggle('on', id === s); }
$('sp0').onclick = () => setSpeed(0); $('sp1').onclick = () => setSpeed(1); $('sp3').onclick = () => setSpeed(3);
$('draft').onclick = () => { S.drafting = !S.drafting; updateHUD(); };
$('rotl').onclick = () => setRot(ROT - 1);
$('rotr').onclick = () => setRot(ROT + 1);
$('zin').onclick = () => setScale(scale + 1, stage.clientWidth / 2, stage.clientHeight / 2);
$('zout').onclick = () => setScale(scale - 1, stage.clientWidth / 2, stage.clientHeight / 2);
setSpeed(1);
// ---------- Banner colour ----------
const BANNER_COLORS = [['Crimson', '#b3202a'], ['Royal blue', '#2a56c4'], ['Forest green', '#2f8f46'], ['Purple', '#7a3fa8'], ['Gold', '#d9a31a'], ['Black', '#2b2b33'], ['White', '#e8e4d6'], ['Teal', '#1f9a9a']];
function chooseBanner(hex) {
  S.banner = hex || undefined; setBanner(hex || null); if (hex) $('bannerpick').value = hex;
  for (const b of $('banner-sw').children) b.classList.toggle('on', b.dataset.hex === hex);
  doSave(true);
}
for (const [n, hex] of BANNER_COLORS) { const b = document.createElement('button'); b.type = 'button'; b.className = 'swatch'; b.title = n; b.style.background = hex; b.dataset.hex = hex; b.onclick = () => chooseBanner(hex); $('banner-sw').appendChild(b); }
$('bannerpick').oninput = e => chooseBanner(e.target.value);
$('banner-reset').onclick = () => chooseBanner(null);
$('bannerbtn').onclick = () => { const p = $('banner'); p.hidden = !p.hidden; $('bannerbtn').classList.toggle('on', !p.hidden); };
// ---------- Save / load ----------
const SAVE_KEY = 'thornwick-save-1';
function doSave(quiet) { try { localStorage.setItem(SAVE_KEY, saveWorld(S)); if (!quiet) toast('Game saved'); } catch (e) { if (!quiet) toast('Saving is blocked in this browser'); } }
function loadSaved() { try { const t = localStorage.getItem(SAVE_KEY); if (t) { const w = loadWorld(t); if (w) { S = w; return true; } } } catch (e) { } return false; }
$('savebtn').onclick = () => doSave(false);
$('newbtn').onclick = () => { if (!confirm('Start a new village? Your saved game will be replaced.')) return; S = createWorld(Math.floor(Math.random() * 9000) + 1); setBanner(null); pinned = null; roadAnchor = null; try { localStorage.removeItem(SAVE_KEY); } catch (e) { } centerOn(20, 24); updateHUD(); updateInfo(); toast('A new village'); };
setInterval(() => doSave(true), 30000);
window.addEventListener('beforeunload', () => doSave(true));

// ---------- Main loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now;
  const sp = 340 / scale * dt * 1.0;
  if (keys['w'] || keys['arrowup']) cam.y -= sp; if (keys['s'] || keys['arrowdown']) cam.y += sp;
  if (keys['a'] || keys['arrowleft']) cam.x -= sp; if (keys['d'] || keys['arrowright']) cam.x += sp;
  if (speed > 0) { acc += dt * speed; while (acc >= 1) { acc -= 1; tick(S); updateHUD(); } }
  updateHint(); draw(); requestAnimationFrame(frame);
}
loadSaved(); setBanner(S.banner || null); resize(); centerOn(20, 24); updateHUD(); updateInfo();
requestAnimationFrame(frame);
window.__game = { zone: (k, x, y) => setZone(S, k, x, y), get S() { return S; }, setTool, place: (t, x, y) => place(S, t, x, y), tick: () => { tick(S); updateHUD(); } };

</script>
